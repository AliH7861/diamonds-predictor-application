[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F403", "F405"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.pyright]
include = [
    "src/assistant/api.py",
    "src/assistant/streamlit_app/client.py",
    "src/assistant/clarification.py",
    "src/assistant/generation.py",
    "src/assistant/schemas.py",
    "src/assistant/transport.py",
    "app.py",
    "config.py",
]
exclude = ["**/__pycache__", ".venv", "frontend", "notebooks"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
