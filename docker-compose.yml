name: diamonds-predictor

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-models:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull qwen3.5:0.8b && ollama pull nomic-embed-text
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DIAMOND_FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DIAMOND_LOG_LEVEL: INFO
    ports:
      - "8770:8770"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./vector_db:/app/vector_db
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-data:
